<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý khóa học</title>
</head>
<body>
<h1>Danh sách Khóa học</h1>
<a href="/admin/courses/new">Thêm khóa học mới</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên khóa học</th>
        <th>Số tín chỉ</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${courses}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.credits}"></td>
        <td>
            <a th:href="@{'/admin/courses/delete/' + ${c.id}}"
               onclick="return confirm('Bạn chắc chắn muốn xóa?')">Xóa</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>

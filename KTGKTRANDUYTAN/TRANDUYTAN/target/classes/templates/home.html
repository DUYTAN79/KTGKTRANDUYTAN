<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Trang Chủ</title>
</head>
<body class="container mt-4">
<nav class="navbar navbar-expand-lg bg-light mb-4">
    <form class="d-flex" action="/home" method="get">
        <input class="form-control me-2" type="search" name="keyword" placeholder="Tìm theo tên...">
        <button class="btn btn-primary" type="submit">Tìm</button>
    </form>
</nav>

<div class="row">
    <div class="col-md-4" th:each="c : ${coursePage.content}">
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title" th:text="${c.name}"></h5>
                <p class="card-text">Tín chỉ: <span th:text="${c.credits}"></span></p>
                <form th:action="@{'/enroll/' + ${c.id}}" method="post">
                    <button class="btn btn-success">Enroll</button>
                </form>
            </div>
        </div>
    </div>
</div>

<nav>
    <ul class="pagination">
        <li class="page-item" th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}">
            <a class="page-link" th:href="@{/home(page=${i})}" th:text="${i+1}"></a>
        </li>
    </ul>
</nav>
</body>
</html>
